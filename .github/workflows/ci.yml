name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile Python sources
        run: python -m compileall -q main.py pdf_engine scraper

      - name: Run tests
        run: python -m pytest

      - name: Start and probe application
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/tankopress.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /tmp/tankopress-home.html; then
              break
            fi
            sleep 1
          done
          grep -q "TankoPress" /tmp/tankopress-home.html
          kill "$APP_PID"
          wait "$APP_PID" || true
          trap - EXIT
